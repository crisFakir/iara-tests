<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Plataforma de bilheteira online para festivais - Compre bilhetes com MB Way de forma segura e rápida">
  <meta name="keywords" content="festivais, bilhetes, tickets, eventos, MB Way, Portugal">
  <meta name="author" content="Festival Tickets">
  
  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Festival Tickets">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Festival Tickets - Bilheteira Online">
  <meta property="og:description" content="Compre bilhetes para os melhores festivais de Portugal">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://festivaltickets.pt">
  <meta property="og:image" content="/og-image.png">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Festival Tickets">
  <meta name="twitter:description" content="Compre bilhetes para festivais com MB Way">
  <meta name="twitter:image" content="/twitter-image.png">
  
  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <title>Festival Tickets - Bilheteira Online para Festivais</title>
  
  <style>
    /* Critical CSS for faster initial paint */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Loading Screen */
    .app-loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
    }
    
    .loader-content {
      text-align: center;
      color: white;
    }
    
    .loader-logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    .loader-text {
      margin-top: 16px;
      font-size: 18px;
      font-weight: 500;
      opacity: 0.9;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Prevent scroll bounce on iOS */
    html {
      position: fixed;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      position: fixed;
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading Screen -->
    <div class="app-loader" id="app-loader">
      <div class="loader-content">
        <svg class="loader-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="50" stroke="white" stroke-width="4" fill="none" opacity="0.3"/>
          <path d="M60 10 L60 50 L85 35 Z" fill="white"/>
          <path d="M60 110 L60 70 L35 85 Z" fill="white"/>
          <circle cx="60" cy="60" r="15" fill="white"/>
        </svg>
        <div class="loader-spinner"></div>
        <div class="loader-text">A carregar...</div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- No Script Fallback -->
  <noscript>
    <div style="padding: 20px; background: #ff4444; color: white; text-align: center;">
      Por favor ative o JavaScript para utilizar esta aplicação.
    </div>
  </noscript>
</body>
</html>
