<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.3" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Fundo com gradiente sutil -->
  <rect width="400" height="200" fill="url(#gradient2)" opacity="0.1"/>
  
  <!-- Marca Principal -->
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="300" 
        text-anchor="middle" fill="#333333" letter-spacing="2" filter="url(#shadow)">
    IARA CARREIRA
  </text>
  
  <!-- Subtítulo -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="400" 
        text-anchor="middle" fill="#666666" letter-spacing="1">
    Design & Creative Solutions
  </text>
  
  <!-- Elemento decorativo -->
  <line x1="100" y1="130" x2="300" y2="130" stroke="url(#gradient1)" stroke-width="2" opacity="0.6"/>
  
  <!-- Versão marca d'água (mais sutil) -->
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="200" 
        text-anchor="middle" fill="#667eea" opacity="0.3" letter-spacing="3">
    IARA CARREIRA
  </text>
</svg>