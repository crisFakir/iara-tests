name: Vinted Processing

on:
  workflow_dispatch:
    inputs:
      size:
        description: Canvas size (square)
        type: number
        default: 2048
  push:
    branches: [ vinted-fundo-consistente, main, master ]
    paths:
      - 'vinted/input/**'
      - 'vinted/requirements.txt'
      - 'vinted/process_vinted.py'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vinted/requirements.txt

      - name: Ensure directories
        run: |
          mkdir -p vinted/input vinted/output

      - name: Process images
        shell: bash
        run: |
          SIZE="${{ inputs.size }}"
          python vinted/process_vinted.py \
            --input vinted/input \
            --output vinted/output \
            --size "${SIZE:-2048}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: vinted-output
          path: vinted/output/*.jpg
          if-no-files-found: warn